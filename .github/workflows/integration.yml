name: integration

# C099 §12 — service-backed integration gate. Provisions disposable
# PostgreSQL/Redis as ephemeral job services (no shared persistent state),
# applies C007 migrations from zero, then runs the DB-gated suites.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}-integration
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PNPM_VERSION: 10.10.0

jobs:
  integration:
    name: ci / integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: devguard_test
          POSTGRES_PASSWORD: devguard_test_local
          POSTGRES_DB: devguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devguard_test -d devguard_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24

      redis:
        image: redis:7.2-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 24

    env:
      DEVGUARD_TEST_DATABASE_URL: postgres://devguard_test:devguard_test_local@127.0.0.1:5432/devguard_test

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # run-integration.mjs validates the URL is disposable-shaped, builds,
      # and runs the unit project which includes the DB-gated suites.
      - run: node scripts/ci/run-integration.mjs
