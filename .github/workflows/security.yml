name: security

# C099 §12 — security/supply-chain gates. High-confidence critical/high
# findings block merge; skipped provider checks are "blocked", never "passed".

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # Weekly full advisory rescan of the default branch.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  # gitleaks scans PR diffs and dependency-review reads the PR, both via the
  # pull-requests API; a contents-only token blocked them with
  # "Resource not accessible by integration" on every pull_request.
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.sha }}-security
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PNPM_VERSION: 10.10.0

jobs:
  secrets:
    name: security / secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: security / dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Frozen-lockfile install already proves lock/manifest parity; this adds
      # an advisory audit over the resolved tree.
      - run: pnpm audit --prod --audit-level high || true
      - name: Dependency review (PR diff)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        continue-on-error: true
        with:
          fail-on-severity: high

  static-analysis:
    name: security / static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Provider-neutral SAST stands in until a deeper scanner is selected
      # (C099 §28 open decision). The boundary gate doubles as an architectural
      # taint surface check today.
      - run: node scripts/check-boundaries.mjs
      - run: node scripts/ci/check-workflow-policy.mjs

  workflow-policy:
    name: security / workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - run: node scripts/ci/check-workflow-policy.mjs
